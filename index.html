<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GPA Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Full screen GPA Calculator with explanation">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header>
    <h1>GPA Calculator</h1>
  </header>

  <main>

    <div class="section">
      <h2>How to use this calculator</h2>
      <ul>
        <li>Enter grade point.</li>
        <li>Enter subject credit.</li>
        <li>Click “Add Subject”.</li>
        <li>Click “Calculate GPA”.</li>
      </ul>
    </div>

    <div class="section calculator">
      <h2>GPA Calculator</h2>

      <div id="subjects">
        <div class="row">
          <input type="number" class="grade" placeholder="Grade Point">
          <input type="number" class="credit" placeholder="Credit">
        </div>
      </div>

      <div class="buttons">
        <button onclick="addSubject()">Add Subject</button>
        <button onclick="calculateGPA()">Calculate GPA</button>
      </div>

      <div class="result" id="result"></div>
    </div>

  </main>

<footer>
  Made with ❤️ by <strong>Ujjwal Pandey</strong><br>
  🔗 <a href="https://github.com/pandeyujjwal975/GPA-Calculator" target="_blank">
  View Source on GitHub
  </a>
</footer>

</div>

<script src="script.js"></script>
</body>
</html>
